[project]
name = "extraer-pdfs"
version = "0.1.22"
description = "Manejor de PDFs"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Malcom Navarro", email = "you@example.com" }
]
dependencies = [
  "flet[all]==0.28.3",
  "langchain>=0.3.28",
  "langchain-community>=0.3.31",
  "langchain-google-genai>=2.1.12",
  "langchain-openai>=0.3.35",
  "onnxruntime>=1.20.1",
  "onnxtr[cpu,cpu-headless]>=0.5.1",
  "opencv-python-headless>=4.13.0.92",
  "pydantic>=2.12.5",
  "pymupdf>=1.26.5",
  "pymupdf4llm>=0.0.27",
  "python-dotenv>=1.2.1",
  # NOTA: pywin32 se eliminó del empaquetado (~17 MB). No se importa en ningún
  # sitio: el único uso de Win32 (GetCommandLineW en main._win32_cmdline_args)
  # va por ctypes, y la impresión es sin pywin32. Si en el futuro algún módulo
  # lo necesita, volver a añadir: "pywin32>=311 ; sys_platform == 'win32'".
]

[tool.flet]
# org name in reverse domain name notation, e.g. "com.mycompany".
# Combined with project.name to build bundle ID for iOS and Android apps
org = "com.mycompany"

# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
product = "extraer-pdfs"

# company name to display in about app dialogs
company = "Flet"

# copyright text to display in about app dialogs
copyright = "Copyright (C) 2025 by Flet"

[tool.flet.app]
path = "src"

# ── Optimización del empaquetado (Tier 1, sin cambios de funcionalidad) ──────
# Compila el código de la app y de los paquetes a .pyc y elimina el .py fuente,
# reduciendo el tamaño del bundle. Las extensiones nativas (.pyd/.dll) y los
# datos de modelos (.onnx/.json) no se tocan.
[tool.flet.compile]
app = true
packages = true

# Globs de archivos a eliminar del site-packages empaquetado. Todo lo listado
# aquí NO se usa en runtime de la app empaquetada:
#   - flet_desktop: solo se importa en modo dev (`flet run`); en el build el
#     Python corre embebido en el runner de Flutter (is_embedded()=True), así
#     que la rama que lo carga queda fuera. ~95 MB.
#   - flet_web: solo el servidor web de Flet lo usa; la app desktop no. ~12 MB.
#   - *.pyi (type stubs) y suites de tests: irrelevantes en runtime.
[tool.flet.cleanup]
packages = true
package_files = [
  "**/flet_desktop/**",
  "**/flet_web/**",
  "**/*.pyi",
  "**/tests/**",
  "**/test/**",
]

[tool.uv]
dev-dependencies = [
    "flet[all]==0.28.3",
    "pytest>=8.4.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flet = {extras = ["all"], version = "0.28.3"}
pytest = ">=8.4.2"

[tool.pytest.ini_options]
# src/ no es un paquete instalable; añadirlo al sys.path para que los tests
# puedan hacer `import pdf_viewer.renderer`, `import recent_files`, etc.
pythonpath = ["src"]
testpaths  = ["tests"]
# -q: salida concisa, -ra: resumen de tests no-pass al final
addopts = "-q -ra"
