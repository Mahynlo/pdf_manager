[project]
name = "extraer-pdfs"
version = "0.1.28"
description = "Manejor de PDFs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Malcom Navarro", email = "you@example.com" }
]
dependencies = [
  "markdown-it-py>=4.0",
  "numpy>=2.0",
  # OCR: modelos de PaddleOCR (src/assets/ocr_models) con onnxruntime y NumPy.
  # Sin onnxtr ni OpenCV/SciPy (~200 MB menos en el ejecutable): ver pdf_core/ocr/paddle.py.
  "onnxruntime>=1.20.1",
  # Asistente IA: el cliente oficial de la API de OpenAI, que también hablan Gemini y los
  # servidores locales (Ollama, LM Studio…). Ver pdf_core/agent/providers.py.
  "openai>=3.45,<4",
  "pydantic>=2.12.5",
  "pypdfium2>=5.14",
  "python-dotenv>=1.2.1",
  # NOTA: pywin32 se eliminó del empaquetado (~17 MB). No se importa en ningún
  # sitio: el único uso de Win32 (GetCommandLineW en main._win32_cmdline_args)
  # va por ctypes, y la impresión es sin pywin32. Si en el futuro algún módulo
  # lo necesita, volver a añadir: "pywin32>=311 ; sys_platform == 'win32'".
  "pywebview>=6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
# Solo versiones publicadas hace al menos una semana: una versión maliciosa subida a PyPI
# (como litellm 1.82.7/1.82.8 y 1.107.0 en 2026) suele detectarse y retirarse antes.
exclude-newer = "7 days"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2"

[tool.pytest.ini_options]
# src/ no es un paquete instalable; añadirlo al sys.path para que los tests
# puedan hacer `import pdf_core`.
pythonpath = ["src", "."]
testpaths  = ["tests"]
# -q: salida concisa, -ra: resumen de tests no-pass al final
addopts = "-q -ra"

[tool.ruff]
include = [
    "app/**/*.py",
    "src/pdf_core/**/*.py",
    "tests/**/*.py",
]
line-length = 120
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
# F: errores reales · E9: sintaxis · I: orden de imports · B: bugs comunes · UP: sintaxis moderna
select = ["F", "E9", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pdf_core"]
