name: Build & Package Windows Installer

# Dispara el workflow:
#   - Al hacer push de un tag vX.Y.Z  → compila + crea Release en GitHub
#   - Manualmente desde la UI de GitHub (Actions → Run workflow)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version (deja en blanco para leer de pyproject.toml)"
        required: false
        default: ""

jobs:
  build-windows:
    name: Build Windows App + Installer
    # IMPORTANTE: NO usar windows-latest. GitHub lo actualizó a Windows Server
    # 2025 con Visual Studio 2026 (generador CMake "Visual Studio 18 2026"), que
    # Flutter 3.29.2 (fijado por Flet 0.28.3) no reconoce → el build falla con
    # "Unable to generate build files". windows-2022 trae VS 2022 (generador
    # "Visual Studio 17 2022"), soportado por Flutter 3.29.2.
    runs-on: windows-2022
    permissions:
      contents: write   # necesario para crear GitHub Releases

    steps:
      # ── 1. Código fuente ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Determinar version ───────────────────────────────────────────────
      - name: Get version
        id: version
        shell: pwsh
        run: |
          # Prioridad: input manual > tag git > pyproject.toml
          $ver = "${{ github.event.inputs.version_override }}"

          if (-not $ver -and "${{ github.ref }}" -match "refs/tags/v(.+)") {
            $ver = $Matches[1]
          }

          if (-not $ver) {
            $content = Get-Content pyproject.toml -Raw
            if ($content -match 'version\s*=\s*"([^"]+)"') {
              $ver = $Matches[1]
            } else {
              $ver = "0.1.0"
            }
          }

          Write-Host "Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      # ── 3. Instalar uv ──────────────────────────────────────────────────────
      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # ── 4. Cachear Flutter gestionado por Flet (~/.flet) ───────────────────
      #       Flet descarga Flutter automáticamente la primera vez;
      #       la cache evita re-descargarlo en cada run.
      - name: Cache Flet/Flutter
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.flet
          key: flet-flutter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            flet-flutter-${{ runner.os }}-

      # ── 5. Instalar dependencias Python ────────────────────────────────────
      - name: Install Python dependencies
        run: uv sync

      # ── 6. Build con Flet ───────────────────────────────────────────────────
      - name: Build Windows app
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv run flet build windows -v

      # ── 7. Verificar y mostrar salida del build ─────────────────────────────
      - name: Locate build output
        id: buildout
        shell: pwsh
        run: |
          $base = "build\windows"
          Write-Host "Contenido de $base :"
          Get-ChildItem $base -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          # Ruta estándar de Flutter para Windows x64
          $expected = "build\windows\x64\runner\Release"
          if (Test-Path $expected) {
            echo "BUILD_DIR=$expected" >> $env:GITHUB_OUTPUT
          } else {
            # Fallback: primer directorio que contenga un .exe
            $found = Get-ChildItem $base -Filter "*.exe" -Recurse | Select-Object -First 1
            if (-not $found) {
              Write-Error "No se encontro ningun .exe en $base"
              exit 1
            }
            echo "BUILD_DIR=$($found.DirectoryName)" >> $env:GITHUB_OUTPUT
          }

      # ── 7b. Compilar el launcher de "Abrir con" ─────────────────────────────
      #   El exe de Flet no arranca si recibe argumentos (ventana en blanco), asi
      #   que "Abrir con" pasa por este launcher nativo. Se compila DENTRO de
      #   BUILD_DIR para que el [Files] del .iss lo copie al instalador.
      - name: Compile launcher
        shell: pwsh
        run: |
          $buildDir = "${{ steps.buildout.outputs.BUILD_DIR }}"

          # El runner (windows-2022) trae gcc via MSYS2 en C:\msys64 pero NO en
          # el PATH. Hay que usar el toolchain NATIVO (ucrt64/mingw64);
          # NO usar C:\msys64\usr\bin\gcc.exe -> genera binarios que dependen de
          # msys-2.0.dll (no autonomos). Se sondean rutas conocidas y, como ultimo
          # recurso, se instala mingw via choco.
          $candidates = @(
            "C:\msys64\ucrt64\bin\gcc.exe",
            "C:\msys64\mingw64\bin\gcc.exe"
          )
          $gcc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gcc) { $gcc = (Get-Command gcc -ErrorAction SilentlyContinue).Source }
          if (-not $gcc) {
            Write-Host "gcc nativo no encontrado; instalando mingw via choco ..."
            choco install mingw --no-progress -y
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + `
                        [System.Environment]::GetEnvironmentVariable("Path","User")
            $gcc = (Get-Command gcc -ErrorAction SilentlyContinue).Source
          }
          if (-not $gcc) { Write-Error "No se encontro gcc (mingw) para compilar el launcher"; exit 1 }

          Write-Host "Usando gcc: $gcc"
          & $gcc --version | Select-Object -First 1

          # Compilar el recurso de icono (launcher.rc -> .o) y enlazarlo, para que
          # launcher.exe lleve el icono de la app embebido y "Abrir con" no muestre
          # el generico. windres esta junto a gcc en el toolchain MinGW.
          $windres = Join-Path (Split-Path $gcc) "windres.exe"
          if (-not (Test-Path $windres)) { $windres = (Get-Command windres -ErrorAction SilentlyContinue).Source }
          $resArgs = @()
          if ($windres) {
            & $windres launcher\launcher.rc -O coff --include-dir launcher -o "$buildDir\launcher_res.o"
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$buildDir\launcher_res.o")) {
              $resArgs = @("$buildDir\launcher_res.o")
              Write-Host "Recurso de icono compilado (windres)"
            } else {
              Write-Host "AVISO: windres fallo; launcher sin icono."
            }
          } else {
            Write-Host "AVISO: windres no encontrado; launcher sin icono."
          }

          & $gcc launcher\launcher.c @resArgs -o "$buildDir\launcher.exe" `
            -municode -static -mwindows -O2 -s -lws2_32 -lshell32
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$buildDir\launcher.exe")) {
            Write-Error "Fallo la compilacion del launcher (codigo $LASTEXITCODE)"
            exit 1
          }
          Write-Host "launcher.exe OK en $buildDir"

      # ── 8. Instalar InnoSetup via Chocolatey ────────────────────────────────
      - name: Install InnoSetup
        run: choco install innosetup --no-progress -y

      # ── 9. Compilar el instalador ───────────────────────────────────────────
      - name: Compile installer
        shell: pwsh
        run: |
          $ISCC    = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $IssFile = "installer\setup.iss"
          $version = "${{ steps.version.outputs.VERSION }}"
          $buildDir = "${{ steps.buildout.outputs.BUILD_DIR }}"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Write-Host "Compilando instalador v$version desde $buildDir ..."
          & $ISCC `
            "/DMyAppVersion=$version" `
            "/DMyAppSourceDir=$buildDir" `
            $IssFile

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC.exe fallo con codigo $LASTEXITCODE"
            exit 1
          }

          Write-Host "Archivos en dist/:"
          Get-ChildItem dist -Filter "*.exe" | ForEach-Object {
            Write-Host "  $($_.Name)  ($([math]::Round($_.Length / 1MB, 1)) MB)"
          }

      # ── 10. Subir instalador como artefacto del workflow ────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtraerPDFs-installer-${{ steps.version.outputs.VERSION }}
          path: dist/*.exe
          if-no-files-found: error

      # ── 11. Crear o actualizar GitHub Release ───────────────────────────────
      #   - Tag push v*   → crea release normal con release notes automáticas
      #   - workflow_dispatch con version_override → actualiza release existente
      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version_override != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "Extraer PDFs v${{ steps.version.outputs.VERSION }}"
          files: dist/*.exe
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
