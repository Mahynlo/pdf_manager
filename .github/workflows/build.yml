name: Build & Package Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version (deja en blanco para leer de pyproject.toml)"
        required: false
        default: ""

jobs:
  build-windows:
    name: Build Windows App + Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version_override }}"
          if (-not $ver -and "${{ github.ref }}" -match "refs/tags/v(.+)") {
            $ver = $Matches[1]
          }
          if (-not $ver) {
            $content = Get-Content pyproject.toml -Raw
            if ($content -match 'version\s*=\s*"([^"]+)"') {
              $ver = $Matches[1]
            } else {
              $ver = "0.1.0"
            }
          }
          Write-Host "Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Cache Flet/Flutter
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.flet
          key: flet-flutter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            flet-flutter-${{ runner.os }}-

      - name: Install Python dependencies
        run: uv sync

      - name: Build Windows app
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv run flet build windows -v

      - name: Locate build output
        id: buildout
        shell: pwsh
        run: |
          $base = "build\windows"
          $expected = "build\windows\x64\runner\Release"
          if (Test-Path $expected) {
            echo "BUILD_DIR=$expected" >> $env:GITHUB_OUTPUT
          } else {
            $found = Get-ChildItem $base -Filter "*.exe" -Recurse | Select-Object -First 1
            if (-not $found) { Write-Error "No se encontró .exe en $base"; exit 1 }
            echo "BUILD_DIR=$($found.DirectoryName)" >> $env:GITHUB_OUTPUT
          }
          Write-Host "BUILD_DIR: $(cat $env:GITHUB_OUTPUT | Select-String BUILD_DIR)"

      - name: Install InnoSetup
        run: choco install innosetup --no-progress -y

      # ── PASO CLAVE: parchear el .iss con el PATH real del build ─────────────
      # Si flet build produce el exe en un subdirectorio diferente al esperado,
      # este paso lo detecta y parchea el .iss automáticamente.
      - name: Patch setup.iss with real build dir
        shell: pwsh
        run: |
          $buildDir = "${{ steps.buildout.outputs.BUILD_DIR }}"
          $issPath  = "installer\setup.iss"
          $content  = Get-Content $issPath -Raw
          # Reemplazar la macro MyAppSourceDir con la ruta real detectada
          $content  = $content -replace '#define MyAppSourceDir.*', "#define MyAppSourceDir `"$buildDir`""
          Set-Content $issPath $content -Encoding UTF8
          Write-Host "setup.iss parcheado con BUILD_DIR=$buildDir"

      - name: Compile installer
        shell: pwsh
        run: |
          $ISCC    = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $IssFile = "installer\setup.iss"
          $version = "${{ steps.version.outputs.VERSION }}"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & $ISCC "/DMyAppVersion=$version" $IssFile
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC.exe falló con código $LASTEXITCODE"; exit 1 }

          Write-Host "Archivos en dist/:"
          Get-ChildItem dist -Filter "*.exe" | ForEach-Object {
            Write-Host "  $($_.Name)  ($([math]::Round($_.Length / 1MB, 1)) MB)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtraerPDFs-installer-${{ steps.version.outputs.VERSION }}
          path: dist/*.exe
          if-no-files-found: error
      # ── 11. Crear GitHub Release (solo en tags v*) 
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Extraer PDFs v${{ steps.version.outputs.VERSION }}"
          files: dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}